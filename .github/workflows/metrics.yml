name: Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: Karan-More214
          filename: metrics.languages.svg
          output_action: none
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_indepth: no
          plugin_languages_sections: most-used

      - name: Commit if changed
        run: |
          sudo cp /metrics_renders/metrics.languages.svg assets/metrics.languages.svg
          git config user.name  "Karan-More214"
          git config user.email "193403603+Karan-More214@users.noreply.github.com"
          git add assets/metrics.languages.svg
          git diff --staged --quiet || git commit -m "chore: refresh language metrics"
          git pull --rebase
          git push
